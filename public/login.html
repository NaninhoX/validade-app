<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a6cff">
<title>Entrar · Controle de Validade</title>
<link rel="stylesheet" href="app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background:
    radial-gradient(900px 500px at 15% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(700px 420px at 90% 90%, color-mix(in srgb, #8b5cf6 12%, transparent), transparent 60%), var(--bg); }
  .box { width: min(100%, 400px); animation: rise .7s var(--ease) both; }
  .box .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #4c9aff, #0a6cff 55%, #004cc4); box-shadow: 0 10px 30px rgba(10,108,255,.4); font-size: 26px; }
  h1 { text-align: center; font-size: 26px; }
  .sub { text-align: center; color: var(--muted); margin: 6px 0 24px; }
  .card { padding: 26px; border-radius: 22px; box-shadow: var(--shadow-2); }
  .field { margin-bottom: 16px; }
  input { min-height: 48px; font-size: 17px; }
  #pin { letter-spacing: .4em; text-align: center; font-size: 22px; }
  .err { color: var(--bad); font-size: 13px; min-height: 20px; margin: -4px 0 10px; }
  button.primary { width: 100%; min-height: 48px; font-size: 16px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
</style>
</head>
<body>
<main class="box">
  <div class="logo" id="logo"></div>
  <h1>Controle de Validade</h1>
  <p class="sub">Entre com seu nome e PIN</p>
  <form class="card" id="f" autocomplete="on">
    <div class="field"><label class="f" for="nome">Nome</label><input id="nome" autocomplete="username" autocapitalize="characters" required></div>
    <div class="field"><label class="f" for="pin">PIN (6 a 8 números)</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="\d{6,8}" maxlength="8" required></div>
    <div class="err" id="err" role="alert"></div>
    <button class="primary" id="ok">Entrar</button>
  </form>
  <p class="small muted" style="text-align:center;margin-top:16px">Esqueceu o PIN? Peça a um administrador para redefinir.</p>
</main>
<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
