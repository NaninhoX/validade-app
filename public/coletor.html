<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Coletor · Controle de Validade</title>
<link rel="stylesheet" href="app.css">
<style>
  body { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  .ctop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--glass); backdrop-filter: saturate(180%) blur(22px); -webkit-backdrop-filter: saturate(180%) blur(22px); border-bottom: 1px solid var(--line); }
  .ctop .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #4c9aff, #0a6cff 55%, #004cc4); color: #fff; display: grid; place-items: center; }
  .ctop .who { flex: 1; min-width: 0; line-height: 1.2; } .ctop .who b { display: block; font-size: 14px; } .ctop .who span { font-size: 11.5px; color: var(--muted); }
  .sync { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 620; border: 0; min-height: 0; background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .sync.off { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .sync.pend { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  section { animation: pagein .35s var(--ease) both; }
  .tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--glass); backdrop-filter: saturate(180%) blur(22px); -webkit-backdrop-filter: saturate(180%) blur(22px); border-top: 1px solid var(--line); }
  .tabbar button { flex-direction: column; gap: 3px; min-height: 54px; border: 0; background: transparent; font-size: 11.5px; font-weight: 560; color: var(--muted); border-radius: 12px; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button[aria-pressed=true] { color: var(--accent); background: var(--accent-soft); }
  .f-wrap { margin-bottom: 14px; }
  .f-wrap .in { position: relative; display: flex; gap: 8px; }
  .f-wrap input, .f-wrap select { min-height: 54px; font-size: 20px; border-radius: 14px; }
  .f-wrap .cam { flex: none; width: 54px; min-height: 54px; border-radius: 14px; color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .step { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; margin-right: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.sq { min-width: 44px; padding: 0; }
  .prev { font-size: 14px; min-height: 22px; margin: -6px 0 12px; }
  .prod { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; animation: rise .35s var(--ease) both; box-shadow: var(--shadow-1); }
  .prod b { display: block; line-height: 1.3; }
  .lotechip { min-height: 36px; font-size: 13px; padding: 0 12px; border-radius: 999px; }
  .big { width: 100%; min-height: 58px; font-size: 18px; border-radius: 16px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: var(--surface); box-shadow: var(--shadow-1); transition: opacity .3s, border-color .3s; animation: rise .35s var(--ease) both; }
  .item.feito { opacity: .55; border-color: var(--good); }
  .item.destaque { outline: 3px solid var(--accent); }
  .item .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .item .acts button { flex: 1; min-height: 46px; border-radius: 12px; }
  .aviso { display: flex; gap: 10px; background: color-mix(in srgb, var(--warn) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; animation: rise .3s var(--ease) both; }
  .undo { position: fixed; z-index: 35; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); padding: 10px 12px 10px 16px; background: var(--ink); color: var(--bg); border-radius: 16px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-2); animation: toastin2 .35s var(--ease); max-width: 536px; margin: 0 auto; }
  .undo span { flex: 1; font-size: 13.5px; min-width: 0; }
  .undo button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); min-height: 36px; }
  @keyframes toastin2 { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  .prog { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 8px 0 14px; } .prog > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .35s var(--ease); border-radius: inherit; }
  .rej { border: 1px solid var(--bad); border-radius: 14px; padding: 12px; margin-top: 14px; font-size: 13px; }
  /* câmera */
  .scan-ov { position: fixed; inset: 0; z-index: 100; background: #000; animation: fade .25s; display: grid; }
  .scan-ov.out { opacity: 0; transition: opacity .2s; }
  .scan-ov video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; color: #fff; background: linear-gradient(#000a, transparent); }
  .scan-top button, .scan-bot button { color: #fff; background: rgba(255, 255, 255, .16); border-color: transparent; backdrop-filter: blur(10px); }
  .scan-bot { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); color: #fff; background: linear-gradient(transparent, #000b); }
  .scan-frame { position: absolute; left: 50%; top: 46%; width: min(78vw, 420px); aspect-ratio: 1.7; transform: translate(-50%, -50%); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); border-radius: 18px; }
  .scan-frame i { position: absolute; width: 30px; height: 30px; border: 4px solid #fff; }
  .scan-frame i:nth-child(1) { left: -2px; top: -2px; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
  .scan-frame i:nth-child(2) { right: -2px; top: -2px; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
  .scan-frame i:nth-child(3) { left: -2px; bottom: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
  .scan-frame i:nth-child(4) { right: -2px; bottom: -2px; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
  .scan-line { position: absolute; left: 6%; right: 6%; height: 2px; background: #ff3b5c; box-shadow: 0 0 14px #ff3b5c; animation: scanline 1.8s ease-in-out infinite alternate; }
  @keyframes scanline { from { top: 10%; } to { top: 90%; } }
</style>
</head>
<body>
<div class="ctop">
  <div class="logo" id="logo"></div>
  <div class="who"><b id="meNome">Coletor</b><span id="meSub">Loja AP52 · São Pedro</span></div>
  <select id="operador" aria-label="Operador" style="width:auto;max-width:130px;min-height:34px;font-size:13px" hidden></select>
  <button class="sync" id="sync">…</button>
  <button class="icon subtle sm" id="sair" title="Sair" hidden></button>
</div>

<main>
  <!-- ENTRADA -->
  <section id="m-entrada">
    <div class="seg" style="width:100%;margin-bottom:16px" role="group" aria-label="Tipo de entrada">
      <button id="tReceber" aria-pressed="true" style="flex:1;min-height:40px">Receber (soma)</button>
      <button id="tContar" aria-pressed="false" style="flex:1;min-height:40px">Contar (define)</button>
    </div>
    <div class="f-wrap"><label class="f" for="end"><span class="step">1</span>Endereço</label>
      <div class="in"><input id="end" list="listaEnd" autocomplete="off" autocapitalize="characters" placeholder="ex.: 1-B-3"><button class="cam" data-cam="end" aria-label="Ler etiqueta do endereço"></button></div><datalist id="listaEnd"></datalist>
      <div id="endChips" aria-label="Atalhos de endereço" style="display:grid;gap:8px;margin-top:10px"></div>
      <div class="xs muted" id="endDesc" style="margin-top:8px;min-height:18px"></div></div>
    <div class="f-wrap"><label class="f" for="ean"><span class="step">2</span>Código de barras (EAN)</label>
      <div class="in"><input id="ean" inputmode="numeric" autocomplete="off" placeholder="bipe ou use a câmera"><button class="cam" data-cam="ean" aria-label="Ler código pela câmera"></button></div></div>
    <div id="prod" class="prod" hidden></div>
    <div id="cadRapido" hidden>
      <div class="f-wrap"><label class="f" for="cNome">Produto novo — nome</label><input id="cNome" autocomplete="off"></div>
      <div class="f-wrap"><label class="f" for="cPreco">Preço (opcional)</label><input id="cPreco" inputmode="decimal" autocomplete="off"></div>
    </div>
    <div class="f-wrap"><label class="f" for="lote"><span class="step">3</span>Lote</label><input id="lote" autocomplete="off" autocapitalize="characters"></div>
    <div class="f-wrap"><label class="f" for="val"><span class="step">4</span>Validade (DDMMAA, DD/MM/AAAA ou MM/AA)</label><input id="val" inputmode="numeric" autocomplete="off" placeholder="ex.: 150327"></div>
    <div class="prev" id="prev" aria-live="polite"></div>
    <div class="f-wrap"><label class="f" for="qtd"><span class="step">5</span>Quantidade</label><input id="qtd" inputmode="numeric" autocomplete="off"></div>
    <div id="avisos"></div>
    <button id="salvar" class="primary big">Salvar</button>
  </section>

  <!-- RONDA -->
  <section id="m-ronda" hidden>
    <div class="f-wrap"><label class="f" for="rEnd">Endereço da ronda</label>
      <div class="in"><input id="rEnd" list="listaEnd" autocomplete="off" autocapitalize="characters" placeholder="bipe a etiqueta ou digite (1-B-3)"><button class="cam" data-cam="rEnd" aria-label="Ler etiqueta do endereço"></button></div></div>
    <button id="rCarregar" class="big" style="margin-bottom:12px">Carregar endereço</button>
    <div id="rInfo" class="muted small"></div>
    <div class="prog" id="rProg" hidden><i></i></div>
    <div class="f-wrap" id="rBuscaBox" hidden><label class="f" for="rBusca">Bipe um produto para localizá-lo na lista</label>
      <div class="in"><input id="rBusca" inputmode="numeric" autocomplete="off"><button class="cam" data-cam="rBusca" aria-label="Ler código pela câmera"></button></div></div>
    <div id="rLista"></div>
    <button id="rNovo" class="big" hidden>＋ Item que não estava na lista</button>
  </section>

  <!-- BAIXA -->
  <section id="m-baixa" hidden>
    <div class="f-wrap"><label class="f" for="bEan">Código de barras (EAN)</label>
      <div class="in"><input id="bEan" inputmode="numeric" autocomplete="off" placeholder="bipe ou use a câmera"><button class="cam" data-cam="bEan" aria-label="Ler código pela câmera"></button></div></div>
    <div id="bLista"></div>
  </section>

  <!-- BUSCA -->
  <section id="m-busca" hidden>
    <div class="f-wrap"><label class="f" for="sEan">EAN ou parte do nome</label>
      <div class="in"><input id="sEan" autocomplete="off" placeholder="onde está esse produto?"><button class="cam" data-cam="sEan" aria-label="Ler código pela câmera"></button></div></div>
    <div id="sLista"></div>
  </section>

  <div id="rejeitados" class="rej" hidden></div>
</main>

<div class="undo" id="undo" hidden><span id="undoTxt"></span><button id="undoBtn">Desfazer</button></div>

<nav class="tabbar" aria-label="Modo">
  <button data-modo="entrada" aria-pressed="true"><span data-i="plus"></span>Entrada</button>
  <button data-modo="ronda" aria-pressed="false"><span data-i="check"></span>Ronda</button>
  <button data-modo="baixa" aria-pressed="false"><span data-i="minus"></span>Baixa</button>
  <button data-modo="busca" aria-pressed="false"><span data-i="search"></span>Buscar</button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitulo" style="font-size:20px"></h2><p class="muted small" id="dlgSub" style="margin:4px 0 16px"></p><div id="dlgCampos"></div>
    <menu><button type="button" id="dlgCancel">Cancelar</button><button type="submit" class="primary">Confirmar</button></menu>
  </form>
</dialog>

<script src="common.js"></script>
<script src="scanner.js"></script>
<script src="coletor.js"></script>
</body>
</html>
